trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main

variables:
  # Only define static/computed values here.
  # Secrets (AZURE_SP_PASSWORD, AZURE_STATIC_WEBAPP_API_TOKEN) must be set in Azure DevOps Variable Group / Pipeline UI.
  AZURE_RESOURCE_GROUP: "Rental-Management"
  AZURE_STATIC_WEBAPP_NAME: "rental-management-frontend"
  AZURE_WEBAPP_NAME: "rental-management-backend"  # Replace with your actual backend app service name
  AZURE_SUBSCRIPTION_ID: "bf912271-f73c-4e2a-b886-17c8fcdf8894"
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '26.x'
  SELF_HOSTED_POOL: 'self-hosted-pool'
  AZURE_STATIC_WEBAPP_API_TOKEN : '4501cc37d1e6b97bcaa0e16b205bbaf8c7d7799ed2c1a3c53701e2ef3e7e5fa602-2690ff0c-1317-48e9-af34-246452674458000122107229ed00'

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: BuildBackend
        displayName: Build & Test Backend
        pool:
          name: $(SELF_HOSTED_POOL)
          demands:
            - agent.os -equals Windows_NT
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(DOTNET_VERSION)

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: 'backend/rental-management.sln'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: 'backend/rental-management.sln'
              arguments: '--configuration Release --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: 'backend/tests/**/*.csproj'
              arguments: '--configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"'
            continueOnError: true

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'backend/api/backend.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/backend_publish'

          - publish: $(Build.ArtifactStagingDirectory)/backend_publish
            artifact: backend_artifact

      - job: BuildFrontend
        displayName: Build Frontend
        pool:
          name: $(SELF_HOSTED_POOL)
          demands:
            - agent.os -equals Windows_NT
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Use Node'

          - task: Npm@1
            displayName: 'npm ci'
            inputs:
              command: 'ci'
              workingDir: 'frontend'

          - task: Npm@1
            displayName: 'npm run build'
            inputs:
              command: 'custom'
              customCommand: 'run build'
              workingDir: 'frontend'

          # Publish the built files directly (not the dist folder)
          - publish: frontend/dist
            artifact: frontend_artifact

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    jobs:
      - deployment: DeployFrontend
        displayName: Deploy Frontend to Azure Static Web Apps
        environment: 'static-web-app'
        pool:
          name: $(SELF_HOSTED_POOL)
          demands:
            - agent.os -equals Windows_NT
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend_artifact

                # Option 1: Use the official Azure Static Web Apps Deploy task (RECOMMENDED)
                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Azure Static Web App'
                  inputs:
                    app_location: '$(Pipeline.Workspace)/frontend_artifact'
                    skip_app_build: true
                    azure_static_web_apps_api_token: '$(AZURE_STATIC_WEBAPP_API_TOKEN)'

                # Option 2: Alternative using PowerShell with proper execution policy (if Option 1 doesn't work)
                # Uncomment the following if you need to use curl approach
                # - task: PowerShell@2
                #   displayName: 'Deploy to Azure Static Web App using REST API'
                #   inputs:
                #     targetType: 'inline'
                #     script: |
                #       # Set execution policy for current session
                #       Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
                #       
                #       # Create zip file
                #       $sourceFolder = "$(Pipeline.Workspace)/frontend_artifact"
                #       $zipPath = "$(Pipeline.Workspace)/frontend-deploy.zip"
                #       
                #       # Remove existing zip if it exists
                #       if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
                #       
                #       # Create zip using .NET classes
                #       Add-Type -AssemblyName System.IO.Compression.FileSystem
                #       [System.IO.Compression.ZipFile]::CreateFromDirectory($sourceFolder, $zipPath)
                #       
                #       # Deploy using Invoke-RestMethod
                #       $headers = @{
                #           'Authorization' = 'Bearer $(AZURE_STATIC_WEBAPP_API_TOKEN)'
                #           'Content-Type' = 'application/zip'
                #       }
                #       
                #       $uri = "https://$(AZURE_STATIC_WEBAPP_NAME).azurestaticapps.net/api/zipdeploy"
                #       
                #       try {
                #           $response = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -InFile $zipPath -ContentType 'application/zip'
                #           Write-Host "Deployment successful: $response"
                #       }
                #       catch {
                #           Write-Error "Deployment failed: $($_.Exception.Message)"
                #           exit 1
                #       }

      - deployment: DeployBackend
        displayName: Deploy Backend to Azure App Service
        environment: 'app-service'
        pool:
          name: $(SELF_HOSTED_POOL)
          demands:
            - agent.os -equals Windows_NT
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend_artifact

                - task: ArchiveFiles@2
                  displayName: 'Create backend deployment package'
                  inputs:
                    rootFolderOrFile: '$(Pipeline.Workspace)/backend_artifact'
                    includeRootFolder: false
                    archiveType: 'zip'
                    archiveFile: '$(Pipeline.Workspace)/backend_publish.zip'
                    replaceExistingArchive: true

                - task: AzureCLI@2
                  displayName: 'Deploy backend to Azure App Service'
                  inputs:
                    azureSubscription: 'AzureServiceConnection-RM'
                    scriptType: 'bat'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo Deploying backend package: $(Pipeline.Workspace)\backend_publish.zip
                      az webapp deploy --resource-group "$(AZURE_RESOURCE_GROUP)" --name "$(AZURE_WEBAPP_NAME)" --src-path "$(Pipeline.Workspace)\backend_publish.zip" --type zip